name: Mod source and content
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon
          ref: 0b14f8acfd97fa2c750e42795249dcc981178ca4
          path: .build/horizon
      - uses: actions/checkout@v4
        with:
          repository: astryxion/Iron-Furnaces
          ref: e1fabfe21abf5b11de1efb2b2f773d5561539d4c
          path: .upstream/iron-furnaces
      - name: Use Horizon's pinned Rust
        run: rustup default 1.99.1
      - name: Test typed API adapter and machine rules
        run: python3 tools/check_v3.py --source .build/horizon --test
      - name: Check original art, recipes and registrations
        run: python3 tools/test_content.py
      - name: Build unified native package
        run: python3 tools/package_v3.py
      - name: Install the official Horizon SDK CLI from the exact engine checkout
        run: cargo install --locked --git https://github.com/horizon-rust/horizon --rev 0b14f8acfd97fa2c750e42795249dcc981178ca4 cargo-horizon-mod
      - name: Build official native SDK package and check it for registry submission
        working-directory: .build/migration-v3/mod
        run: |
          cargo horizon-mod build
          test -f target/horizon-mod/ironfurnaces.hmod
          cargo horizon-mod check target/horizon-mod/ironfurnaces.hmod
      - name: Compile and test the adapter using the downloaded SDK
        working-directory: .build/migration-v3/mod
        run: cargo test
      # upload-artifact v4 excludes hidden directories by default. Copy the
      # exact official SDK output out of .build/ before regenerating the staging tree.
      - name: Stage the SDK-verified package and checksum
        run: |
          set -euo pipefail
          mkdir -p release-candidate
          cp .build/migration-v3/mod/target/horizon-mod/ironfurnaces.hmod release-candidate/ironfurnaces-0.3.2.hmod
          (cd release-candidate && sha256sum ironfurnaces-0.3.2.hmod > SHA256SUMS)
          cat release-candidate/SHA256SUMS
      - name: Check deterministic unified package
        run: |
          cp dist/ironfurnaces-0.3.2.hmod.sha256 /tmp/first.sha256
          python3 tools/package_v3.py
          cmp /tmp/first.sha256 dist/ironfurnaces-0.3.2.hmod.sha256
      - name: Save the SDK-verified package for launcher testing
        uses: actions/upload-artifact@v4
        with:
          name: iron-furnaces-0.3.2-nightly-candidate
          path: release-candidate/
          if-no-files-found: error
      # Full game tests need the matching SDK and privately prepared Minecraft resources.
      # This workflow deliberately claims source/content checks only.
